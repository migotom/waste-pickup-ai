name: Propozycja funkcji
description: Zaproponuj usprawnienie integracji.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Jaki problem chcesz rozwiązać?
      description: Opisz konkretny przypadek użycia.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proponowane rozwiązanie
      description: Jak integracja powinna działać po zmianie?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - Skanowanie harmonogramu
        - Panel Odpady Działdowo
        - Powiadomienia
        - Kalendarz
        - Sensory / dashboard
        - Dokumentacja
        - Inne
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Sprawdzenie
      options:
        - label: Propozycja dotyczy harmonogramów odbioru odpadów w Gminie Działdowo.
          required: true
        - label: Sprawdziłem istniejące zgłoszenia.
          required: true
